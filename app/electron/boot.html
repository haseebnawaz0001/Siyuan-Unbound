<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            background: #1e1e1e;
            font-size: 12px;
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", "Hiragino Sans GB", "Microsoft Yahei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Android Emoji", "EmojiSymbols";
        }

        #bg {
            width: 100%;
            display: flex;
            justify-content: space-around;
            height: 100%;
        }

        #bg svg {
            width: 24vh;
            height: 24vh;
            align-self: center;
        }

        /* Diagonal glowing streaks: triggered by .started once kernel progress reaches 15%, they converge from
           the edges of the screen toward the logo area and fade out once in place */
        #bg svg .streak {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        #bg svg.started .streak {
            animation: bootStreakConverge 2.5s cubic-bezier(0.33, 0, 0.2, 1) var(--delay, 0s) forwards,
                       bootStreakFade 0.85s ease 2.2s forwards;
        }

        @keyframes bootStreakConverge {
            0% {
                opacity: 0;
                transform: translate(var(--dx, 0), var(--dy, 0));
            }
            20% {
                opacity: 0.9;
            }
            100% {
                opacity: 0.9;
                transform: translate(0, 0);
            }
        }

        @keyframes bootStreakFade {
            to {
                opacity: 0;
            }
        }

        /* Logo fragments forming: gently fades in near the end of the streak convergence, then holds still */
        #bg svg .logo path {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            transform: scale(0.94);
        }

        #bg svg.started .logo path {
            animation: bootLogoForm 1s cubic-bezier(0.22, 1, 0.36, 1) 2.1s forwards;
        }

        @keyframes bootLogoForm {
            0% {
                opacity: 0;
                transform: scale(0.94);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Bottom progress area, reserving a safe area to avoid being obscured by the mobile gesture bar */
        #progressWrap {
            position: absolute;
            bottom: env(safe-area-inset-bottom);
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #progressTrack {
            position: absolute;
            height: 2px;
            background-color: #2a2c2f;
            width: 100%;
            top: 0;
        }

        #progress {
            position: absolute;
            height: 2px;
            background-color: #3b3e43;
            box-shadow: 0 0 8px rgba(59, 62, 67, 0.6);
            transition: width 0.6s cubic-bezier(0, 0, 0.2, 1);
            top: 0;
            width: 0;
        }

        #details {
            color: #9aa0a6;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            padding: 8px;
            height: 16px;
            line-height: 16px;
        }
    </style>
</head>
<body>
<div id="bg">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
        <g class="streaks"></g>
        <g class="logo">
            <path fill="#d23f31" d="M37.052 371.676l269.857-269.857v550.507l-269.857 269.857z"></path>
            <path fill="#3b3e43" d="M306.909 101.818l205.091 205.091v550.507l-205.091-205.091z"></path>
            <path fill="#d23f31" d="M512 306.909l205.091-205.091v550.507l-205.091 205.091z"></path>
            <path fill="#3b3e43" d="M717.091 101.818l269.857 269.857v550.507l-269.857-269.857z"></path>
        </g>
    </svg>
</div>
<div id="progressWrap">
    <div id="progressTrack"></div>
    <div id="progress"></div>
    <div id="details"></div>
</div>
<script>
    const getSearch = (key) => {
        if (window.location.search.indexOf('?') === -1) {
            return ''
        }
        let value = ''
        const data = window.location.search.split('?')[1].split('&')
        data.find(item => {
            const keyValue = item.split('=')
            if (keyValue[0] === key) {
                value = keyValue[1]
                return true
            }
        })
        return value
    }
    (async () => {
        const v = getSearch('v')
        const port = getSearch('port') || '6806'
        const progressEl = document.getElementById('progress')
        const detailsEl = document.getElementById('details')
        detailsEl.textContent = "v" + v + ' Booting kernel...'

        // Random starting base value (15-25); smoothly fill to this value while waiting for kernel progress
        const baseProgress = 15 + Math.random() * 10

        // Generate diagonal glowing streaks arranged along the logo's folded edges, which trace out the logo shape once converged
        const streaksG = document.querySelector("#bg svg .streaks");
        if (streaksG) {
            const svgNS = "http://www.w3.org/2000/svg";
            const edges = [
                {x1: 37, y1: 372, x2: 307, y2: 102, color: "#d23f31"},
                {x1: 37, y1: 922, x2: 307, y2: 652, color: "#d23f31"},
                {x1: 307, y1: 102, x2: 512, y2: 307, color: "#3b3e43"},
                {x1: 307, y1: 652, x2: 512, y2: 857, color: "#3b3e43"},
                {x1: 512, y1: 307, x2: 717, y2: 102, color: "#d23f31"},
                {x1: 512, y1: 857, x2: 717, y2: 652, color: "#d23f31"},
                {x1: 717, y1: 102, x2: 987, y2: 372, color: "#3b3e43"},
                {x1: 717, y1: 652, x2: 987, y2: 922, color: "#3b3e43"},
            ];
            const perEdge = 12;
            edges.forEach((e) => {
                for (let i = 0; i < perEdge; i++) {
                    const t = (i + 0.5) / perEdge + (Math.random() - 0.5) * 0.08;
                    const ex = e.x1 + (e.x2 - e.x1) * t;
                    const ey = e.y1 + (e.y2 - e.y1) * t;
                    const len = 60 + Math.random() * 80;
                    const ux = (e.x2 - e.x1);
                    const uy = (e.y2 - e.y1);
                    const ul = Math.sqrt(ux * ux + uy * uy);
                    const sx = ex - ux / ul * len;
                    const sy = ey - uy / ul * len;
                    const line = document.createElementNS(svgNS, "line");
                    line.setAttribute("x1", sx);
                    line.setAttribute("y1", sy);
                    line.setAttribute("x2", ex);
                    line.setAttribute("y2", ey);
                    line.setAttribute("stroke", e.color);
                    line.setAttribute("stroke-width", 3 + Math.random() * 3);
                    line.setAttribute("stroke-linecap", "round");
                    line.setAttribute("class", "streak");
                    line.style.filter = "drop-shadow(0 0 4px rgba(210,63,49,.5))";
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 600 + Math.random() * 800;
                    line.style.setProperty("--dx", Math.cos(angle) * dist + "px");
                    line.style.setProperty("--dy", Math.sin(angle) * dist + "px");
                    line.style.setProperty("--delay", (Math.random() * 0.6) + "s");
                    streaksG.appendChild(line);
                }
            });
        }

        // The current progress only increases, never decreases, to avoid the progress bar jumping back to 0 if the kernel's first reported progress is below the initial base value
        let currentDisplay = 0
        const bgSvg = document.querySelector("#bg svg")
        let animStart = 0
        const setProgress = (target) => {
            if (target > currentDisplay) {
                currentDisplay = target
                progressEl.style.width = target + '%'
                // Trigger the logo convergence animation once the displayed progress reaches 15%
                if (bgSvg && !bgSvg.classList.contains("started") && currentDisplay >= 15) {
                    bgSvg.classList.add("started")
                    animStart = Date.now()
                }
            }
        }
        // Smoothly fill to the random base value first; delay two frames to make sure the browser renders width:0 before triggering the transition
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(baseProgress)
            })
        })

        let progressing = false
        const subscribe = () => {
            const es = new EventSource('http://127.0.0.1:' + port + '/api/system/bootProgressSSE')
            es.onmessage = (event) => {
                const progressData = JSON.parse(event.data)
                // Map kernel progress proportionally onto the baseProgress~100 range, continuing to increase from the currently displayed value
                const display = baseProgress + progressData.progress * (100 - baseProgress) / 100
                setProgress(display)
                detailsEl.textContent = progressData.details
                if (progressData.progress >= 100) {
                    progressing = true
                    es.close()
                    // Once the kernel is done, finish the animation as soon as possible by fast-forwarding the remaining animation to its final state
                    if (animStart > 0) {
                        const animTotalMs = 3100
                        const elapsed = Date.now() - animStart
                        const remaining = animTotalMs - elapsed
                        if (remaining > 0) {
                            // Use a very short wrap-up time (200ms) to fast-forward the animation to its final state
                            const rate = remaining / 200
                            bgSvg.querySelectorAll(".streak, .logo path").forEach((el) => {
                                el.getAnimations().forEach((a) => {
                                    a.playbackRate = rate
                                })
                            })
                        }
                    }
                }
            }
            es.onerror = () => {
                es.close()
                // The HTTP service may not be ready yet during early kernel startup, and EventSource's native
                // reconnect interval is fairly long (about 3s), so reconnect after a short delay here to keep the
                // same fast-retry semantics as the original polling
                if (!progressing) {
                    setTimeout(subscribe, 100)
                }
            }
        }
        subscribe()
    })()
</script>
</body>
</html>
